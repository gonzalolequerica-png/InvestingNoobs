,"l28":{"title":"How to keep crypto safe","articleTitle":"Crypto security: how to protect your assets","body":"Crypto security starts with controlling access to your accounts and private keys. Use a unique password, two-factor authentication and a hardware wallet for long-term holdings. Verify addresses on a trusted device, keep recovery phrases offline and never share them. Treat unexpected links, urgent messages and guaranteed returns as warning signs."},"l29":{"title":"What is DeFi?","articleTitle":"What is DeFi? A beginner guide to decentralised finance","body":"Decentralised finance, or DeFi, uses smart contracts to offer services such as swapping, lending and liquidity provision without a traditional intermediary. The risks include coding bugs, oracle failures, impermanent loss, scams, governance attacks and irreversible transactions. Learn how the protocol works before connecting a wallet or depositing funds."},"l30":{"title":"Stablecoins: how to evaluate them","articleTitle":"How to evaluate stablecoins: reserves, risks and use cases","body":"Stablecoins are crypto assets designed to track a reference value such as the US dollar or euro. Compare the issuer, reserve model, redemption process, transparency, chain risk, fees and legal protections. A stablecoin can lose its peg or become difficult to redeem, so stability should never be treated as a guarantee."}.noticl30{border-left:3px solid #c9a35a;background:#1d180c;padding:14px 16px;color:#b9c1cc;font-size:13px;line-height:1.6;margin:25px 0}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:34px}.btn{border:1px solid #3d4858;border-radius:8px;padding:10px 16px;color:#eceef1;text-decoration:none;font-size:13px;background:#151c26}.btn.primary{border-color:#c9a35a;color:#e8c27a}

<script>
const ARTICLES={"l1":{"title":"What is a cryptocurrency?","articleTitle":"What is a cryptocurrency?","body":"Cryptocurrencies are digital assets recorded on a blockchain. Bitcoin, Ethereum and altcoins serve different purposes. Before buying, study the project's utility, liquidity, tokenomics, custody model and risks. Educational information is not a promise of returns."},"l2":{"title":"What does it mean to buy company stock?","articleTitle":"Investing in stocks: a beginner's guide","body":"Buying a stock means owning a small economic interest in a company. Its price can depend on earnings, debt, growth, interest rates and expectations. Analyze the business rather than only the chart, and remember that a well-known company can still lose value."},"l3":{"title":"Why invest in gold and other metals?","articleTitle":"Gold and precious metals","body":"Gold can diversify a portfolio and sometimes act as a refuge during economic uncertainty, but it is not risk-free. Its price fluctuates and it may not generate regular income. Compare physical gold, funds and exchange-traded products, including storage costs and liquidity."},"l4":{"title":"Crypto vs stocks: what's the difference?","articleTitle":"Cryptocurrency versus stocks","body":"Cryptocurrencies often have higher volatility and depend on networks, protocols and communities. Stocks represent companies and may provide specific economic rights. A useful comparison includes risk, time horizon, liquidity, regulation, custody and the possibility of a total loss."},"l5":{"title":"What is market capitalization?","articleTitle":"Understanding crypto market capitalization","body":"Market capitalization is generally calculated by multiplying price by circulating supply. It helps compare the relative size of projects, but it does not measure quality, revenue or security. Also check fully diluted valuation, locked tokens and holder concentration."},"l6":{"title":"What does \"volatility\" mean?","articleTitle":"Volatility and price risk","body":"Volatility measures how much and how quickly a price moves. In crypto, it can rise because of news, liquidations, low liquidity or large wallets. A suitable position size should allow you to withstand normal market swings without making emotional decisions."},"l7":{"title":"What is inflation?","articleTitle":"Inflation and purchasing power","body":"Inflation reduces purchasing power when prices rise across the economy. No asset automatically protects against it. Separate nominal returns from real returns and consider costs, taxes, time horizon and risk before choosing an investment."},"l8":{"title":"What are fees and why do they matter?","articleTitle":"Fees, spreads and slippage","body":"A trade may include a commission, the difference between buying and selling prices, and slippage when execution differs from the displayed price. These costs reduce results, especially when trading frequently or in illiquid markets. Compare fees and confirm the final amount before executing."},"l9":{"title":"What is an exchange?","articleTitle":"How to choose a crypto exchange","body":"An exchange lets users buy, sell and sometimes custody digital assets. Review security, applicable regulation, transparency, withdrawal methods, fees and customer support. An exchange does not remove market risk, and keeping assets there creates counterparty risk."},"l10":{"title":"What is a wallet?","articleTitle":"Crypto wallets and custody","body":"A wallet manages the keys that control assets on a blockchain. Hot wallets are convenient but connected to the internet; cold wallets reduce online exposure. Make secure backups, verify addresses carefully and never share your recovery phrase."},"l11":{"title":"What is the Bitcoin \"halving\"?","articleTitle":"What is Bitcoin halving?","body":"The Bitcoin halving periodically reduces the reward for creating new bitcoins. It is a protocol rule, not a guarantee that the price will rise. Its market effect depends on supply, demand, liquidity, competition and investor expectations."},"l12":{"title":"What are stablecoins?","articleTitle":"Stablecoins: uses and risks","body":"Stablecoins aim to track the value of a currency such as the dollar or euro. They can help with payments and trading, but they depend on reserves, issuers, contracts and regulation. Understand how a stablecoin is created, redeemed and kept near its target price."},"l13":{"title":"How much money should I start investing with?","articleTitle":"How much money should you invest at first?","body":"Start only with money you do not need for housing, debt or essential expenses. Set a budget, time horizon and maximum loss before buying. Learning with a small amount is usually more important than chasing fast profits."},"l14":{"title":"Is gold a safe investment right now?","articleTitle":"Is gold a safe investment?","body":"Gold can reduce dependence on a single asset, but its price can fall and its costs matter. Safe does not mean guaranteed. Decide what role it should play in a portfolio and compare that role with your goals and risk tolerance."},"l15":{"title":"First steps so you don't get lost","articleTitle":"First steps for new investors","body":"Learn the basics, choose a reputable provider, activate two-factor authentication and start with limited exposure. Keep a record of transactions and avoid decisions driven by pressure, rumors or promises of guaranteed gains."},"l16":{"title":"Common beginner mistakes","articleTitle":"Common beginner mistakes","body":"Frequent mistakes include investing without research, using excessive leverage, chasing rising prices, revenge trading and ignoring fees. A written process and clear limits can reduce emotional decisions, although they cannot eliminate market risk."},"l17":{"title":"Diversifying: not all eggs in one basket","articleTitle":"Diversification and portfolio management","body":"Diversification spreads exposure across assets, sectors or networks. It does not guarantee profits or prevent all losses, especially when markets fall together. Review correlations, liquidity, time horizon and the maximum weight of each position."},"l18":{"title":"Technical vs fundamental analysis","articleTitle":"Technical and fundamental analysis","body":"Technical analysis studies price, volume and market structure. Fundamental analysis examines utility, revenue, users, team, competition and tokenomics. Both are imperfect tools: they help organize hypotheses, not predict the future with certainty."},"l19":{"title":"What is a prop firm?","articleTitle":"What is a prop firm?","body":"A proprietary trading firm may offer access to capital after an evaluation. Its rules can include a profit target, daily loss limit, total drawdown, minimum trading days and strategy restrictions. Read the agreement, fees and payout conditions before participating."},"l20":{"title":"Leverage and margin","articleTitle":"Leverage and margin","body":"Leverage increases the size of a position while margin acts as collateral. It multiplies profits and losses and can cause rapid liquidation. Always calculate risk against total capital and understand what happens when the market moves against you."},"l21":{"title":"Stop-loss and risk management","articleTitle":"Stop-loss and risk management","body":"A stop-loss defines the point where a trade idea is no longer valid. In fast markets it may execute at a different price. Professional risk management combines position size, risk per trade, maximum daily loss and regular review."},"l22":{"title":"Drawdown and maximum loss","articleTitle":"Drawdown and maximum loss","body":"Drawdown is the decline from a previous account peak. Prop firms may use static or trailing limits calculated from balance or equity. A profitable strategy can still breach a rule if the position size is too large."},"l23":{"title":"Spot, futures and CFDs","articleTitle":"Spot, futures and CFDs","body":"Spot trading involves the asset itself; futures and CFDs are derivatives with additional funding, leverage and liquidation risks. Check the provider, collateral, expiry, fees and legal protections that apply in your jurisdiction."},"l24":{"title":"How to compare a prop firm","articleTitle":"How to compare a prop firm","body":"Compare the target, daily and total drawdown, price, minimum days, news and overnight rules, copying restrictions, platform and withdrawal policy. Look for clear terms and a verifiable company. Marketing claims do not replace reading the agreement."},"l25":{"title":"Recognising scams and misleading claims","articleTitle":"How to identify crypto scams","body":"Be cautious about guaranteed profits, urgency, anonymous influencers, new websites and requests for keys. Verify the domain, company, terms and independent sources. Never send a recovery phrase or install remote-access software for someone claiming to be a mentor."},"l26":{"title":"Trading psychology","articleTitle":"Trading psychology","body":"Discipline means following a process after both wins and losses. FOMO, fear and revenge trading can change your risk. Use breaks, a journal, a trading limit and a maximum loss; if you cannot follow them, reduce exposure or stop."},"l27":{"title":"Building a trading plan","articleTitle":"How to build a trading plan","body":"A plan should define the market, strategy, entry, exit, position size, risk, schedule and review process. Test it with simulation or historical data first. Change one variable at a time and measure results, costs and drawdown before increasing size."},"l31":{"title":"What is Bitcoin?","articleTitle":"Bitcoin explained for beginners","body":"Bitcoin is a decentralised digital currency secured by a public blockchain. Learn how transactions, wallets, mining, supply and network consensus fit together. Bitcoin can be volatile and irreversible transactions create real risks, so education and secure custody matter."},"l32":{"title":"What is Ethereum?","articleTitle":"Ethereum explained: smart contracts and gas fees","body":"Ethereum is a programmable blockchain that supports smart contracts and decentralised applications. Understand accounts, gas fees, validators, tokens and network congestion before using a protocol or sending funds."},"l33":{"title":"How does blockchain work?","articleTitle":"How blockchain technology works","body":"A blockchain is a shared record updated by a network under agreed rules. Blocks, hashes, consensus and transaction confirmations help explain why records are difficult to alter, but a blockchain does not remove software, market or human risk."},"l34":{"title":"What is staking?","articleTitle":"Crypto staking: rewards, lockups and risks","body":"Staking can help secure proof-of-stake networks in exchange for potential rewards. Evaluate validator risk, lock-up periods, slashing, inflation, liquidity and custody. Staking rewards are not guaranteed returns."},"l35":{"title":"What is a crypto token?","articleTitle":"Coins vs tokens: the difference explained","body":"A coin usually belongs to its own blockchain, while a token is created on an existing network. Learn the difference between utility, governance, payment and asset-backed tokens, and examine supply, permissions and use cases."},"l36":{"title":"What is a smart contract?","articleTitle":"Smart contracts: benefits and risks","body":"Smart contracts are programs that execute rules on a blockchain. They can automate exchanges and lending, but bugs, admin keys, oracle failures and malicious approvals can cause losses. Review permissions before signing."},"l37":{"title":"What is a DAO?","articleTitle":"DAOs explained for beginners","body":"A decentralised autonomous organisation uses on-chain rules and community voting to coordinate decisions. Check voting power, treasury controls, proposal quality, legal structure and participation incentives before trusting a DAO."},"l38":{"title":"What is a crypto bridge?","articleTitle":"Crypto bridges: how cross-chain transfers work","body":"Bridges move messages or assets between blockchain networks. They add smart-contract, validator, liquidity and operational risks. Confirm the official bridge, supported network, fees and destination address before transferring."},"l39":{"title":"What is a liquidity pool?","articleTitle":"Liquidity pools and automated market makers","body":"Liquidity pools allow users to trade against deposited reserves using automated market makers. Returns may come with impermanent loss, smart-contract risk, price impact and token incentives. Understand the pool formula first."},"l40":{"title":"What is yield farming?","articleTitle":"Yield farming: rewards, APY and risk","body":"Yield farming involves moving capital between protocols to seek rewards. Compare real fees with advertised APY, token emissions, lockups, liquidity and smart-contract risk. High yields usually signal higher uncertainty."},"l41":{"title":"What is a bull market?","articleTitle":"Bull and bear markets explained","body":"A bull market is a sustained period of rising prices, while a bear market involves prolonged weakness. Use a plan, avoid leverage-driven decisions and remember that market labels are descriptions, not forecasts."},"l42":{"title":"What is dollar-cost averaging?","articleTitle":"Dollar-cost averaging for crypto beginners","body":"Dollar-cost averaging invests a fixed amount on a schedule instead of trying to predict every price move. It can reduce timing pressure but does not guarantee profits and cannot protect against a falling asset."},"l43":{"title":"What is a limit order?","articleTitle":"Market orders vs limit orders","body":"A market order prioritises execution while a limit order sets a maximum buying or minimum selling price. Learn about spreads, partial fills, liquidity and slippage before placing an order."},"l44":{"title":"What is technical analysis?","articleTitle":"Technical analysis basics: charts, trends and indicators","body":"Technical analysis studies price and volume to form hypotheses about market behaviour. Support, resistance and indicators are tools, not guarantees. Define invalidation and risk before acting on a chart pattern."},"l45":{"title":"What is fundamental analysis?","articleTitle":"Fundamental analysis for crypto and stocks","body":"Fundamental analysis examines what may create value: users, revenue, cash flow, competition, governance, tokenomics and execution. It helps organise research but cannot predict the future or eliminate investment risk."},"l46":{"title":"What is portfolio rebalancing?","articleTitle":"Portfolio rebalancing explained","body":"Rebalancing restores chosen allocation weights after markets move. Set rules based on time, thresholds, taxes, fees and liquidity. Rebalancing can control concentration but may also create costs and taxable events."},"l47":{"title":"How do crypto taxes work?","articleTitle":"Crypto taxes: a beginner checklist","body":"Tax treatment varies by country and transaction type. Keep records of purchases, sales, swaps, staking, fees and transfers, then use official guidance or a qualified adviser. Do not assume moving between wallets is a sale."},"l48":{"title":"How to avoid phishing scams","articleTitle":"Phishing protection for crypto investors","body":"Phishing attacks imitate exchanges, wallets and support teams. Use bookmarks, verify domains, reject unsolicited links, protect email access and never share passwords, private keys or recovery phrases."},"l49":{"title":"What is a rug pull?","articleTitle":"Rug pulls and crypto scam red flags","body":"A rug pull occurs when insiders remove liquidity or abandon a project after attracting users. Check ownership concentration, liquidity locks, contract permissions, team identity, audit limitations and unrealistic promises."},"l50":{"title":"How to build a long-term investing routine","articleTitle":"A long-term crypto investing routine","body":"A durable routine combines a written goal, time horizon, allocation limits, research schedule, secure custody, records and regular reviews. Focus on process and risk capacity rather than short-term predictions or social-media excitement."}};const params=new URLSearchParams(location.search);const id=params.get('id')||'l1';const item=ARTICLES[id];const root=document.getElementById('article');
if(!item){root.innerHTML='<h1>Article not found</h1><div class="actions"><a class="btn primary" href="blog.html">Back to lessons</a></div>'}
else{
 document.title=item.articleTitle+' | InvestingNoobs'; document.querySelector('meta[name=description]').setAttribute('content',item.articleTitle+' — a practical crypto and investing guide for beginners. Learn the essentials, risks and best practices.'); document.querySelector('meta[property="og:title"]').setAttribute('content',item.articleTitle); document.querySelector('meta[property="og:description"]').setAttribute('content',item.body);
 const next=id==='l27'?'l1':'l'+(Number(id.slice(1))+1);
 root.innerHTML='<div class="article-kicker">INVESTINGNOOBS LEARNING SERIES</div>'+
 '<h1>'+item.articleTitle+'</h1><div class="rule"></div>'+
 '<h2>'+item.title+'</h2>'+
 '<p class="lead">'+item.body+'</p>'+
 '<h3>Why this topic matters</h3>'+
 '<p>Understanding '+item.title.toLowerCase()+' is an important part of becoming a more informed investor. Financial markets reward preparation, patience and clear thinking, but they can also punish decisions made without a plan. This guide explains the idea in practical language and gives you a framework for evaluating it before risking real money.</p>'+
 '<p>Start by separating facts from assumptions. A price chart, a social-media post or a marketing promise is not the same as evidence. Consider what creates value, who carries the risk, how the product works and what could make your original idea wrong.</p>'+
 '<h3>How to think about it</h3>'+
 '<p>Use a simple process: define the opportunity, identify the downside, choose a time horizon and decide what information would change your mind. Write these points down before acting. A written process reduces emotional decisions and makes it easier to review your results honestly.</p>'+
 '<p>Costs and liquidity matter as much as the headline return. Fees, spreads, funding, taxes, slippage and withdrawal limits can change an apparently attractive result. Always check the official terms of the platform or provider and confirm that the service is available and regulated in your country.</p>'+
 '<h3>A practical framework</h3>'+
 '<ol><li><strong>Learn the mechanics.</strong> Know exactly what you own or trade, how orders are executed and what happens in a fast market.</li><li><strong>Measure the risk.</strong> Estimate the maximum realistic loss, including leverage, gaps, liquidation and counterparty risk.</li><li><strong>Start small.</strong> Use simulation or an amount you can afford to lose while you test your assumptions.</li><li><strong>Review the evidence.</strong> Keep a journal of decisions, costs, outcomes and mistakes. Improve the process, not just the last trade.</li></ol>'+
 '<h3>Common mistakes</h3>'+
 '<p>Beginners often focus on profit targets while ignoring the path required to reach them. They may over-size a position, chase a move after it has started, confuse a paper gain with realised money or trust an unverified provider. Another common mistake is changing several variables at once, making it impossible to know what actually helped.</p>'+
 '<p>Do not copy a strategy simply because somebody shows a winning screenshot. Ask whether the results are independently verified, whether losses are included and whether the same risk can be managed by you. A sound approach should still make sense when market conditions become difficult.</p>'+
 '<h3>Before you take action</h3>'+
 '<ul><li>Can I explain the product in my own words?</li><li>What is the worst-case outcome?</li><li>What fees, restrictions and taxes apply?</li><li>How would I exit if the idea fails?</li><li>Am I using money needed for rent, bills or emergencies?</li></ul>'+
 '<div class="notice"><strong>Educational content only:</strong> Markets involve risk, including the possible loss of all invested capital. This article is not financial advice. Do your own research and consult a qualified professional where appropriate.</div>'+
 '<div class="actions"><a class="btn" href="blog.html">← All lessons</a><a class="btn primary" href="article.html?id='+encodeURIComponent(next)+'">Next article →</a></div>'
}

body{background:radial-gradient(circle at 15% 0%,rgba(84,126,210,.12),transparent 35%),radial-gradient(circle at 85% 100%,rgba(234,181,77,.08),transparent 38%),#080d16;color:#e7edf7}

main,.article,.article-content,.article-body{color:#dbe5f2}
h1,h2,h3{letter-spacing:-.025em;color:#f5f7fb}
h1{font-weight:800;text-wrap:balance}
p,li{color:#b9c6d7}
a{color:var(--brand-blue);text-underline-offset:3px;transition:color .2s,opacity .2s}
a:hover{color:#b6d1ff}
button,.btn{border:1px solid rgba(234,181,77,.38)!important;border-radius:10px!important;background:linear-gradient(135deg,#26354c,#172238)!important;color:#f5f7fb!important;box-shadow:0 4px 14px rgba(0,0,0,.2);transition:transform .18s,box-shadow .18s,border-color .18s}
button:hover,.btn:hover{transform:translateY(-1px);border-color:var(--brand-gold)!important;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.article-card,.lesson-card,.learning-value-pack,.decision-checklist{box-shadow:0 14px 34px rgba(0,0,0,.22)!important}
.learning-value-pack,.decision-checklist{border-color:rgba(234,181,77,.28)!important}
blockquote{margin:22px 0;padding:16px 18px;border-left:4px solid var(--brand-gold);border-radius:0 10px 10px 0;background:var(--surface-soft);color:#dbe5f2}
hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:30px 0}
@media(max-width:700px){h1{font-size:clamp(30px,9vw,48px)!important}h2{font-size:clamp(23px,7vw,32px)!important}p,li{font-size:16px!important}.article-card,.lesson-card{padding:16px!important}}
</style>
