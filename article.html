  <main id="main-content"><div class="eyebrow">InvestingNoobs · learning article</div><article id="article"><h1>Choose a lesson</h1><p class="lesson-name">Open a lesson from the course to read its practical guide.</p><div class="empty"><a class="button primary" href="blog.html">Back to lessons</a></div></article></main>

  <script>
  const A={
    l1:{t:'What is a cryptocurrency?',s:'A cryptocurrency is a digital asset transferred between addresses on a blockchain. To evaluate it, look past the price: understand the network, the asset’s purpose, the people who control it and the risks that could destroy demand.',g:[`A blockchain is a shared record maintained by a network of computers. The network, its native asset and the organisation or community building around it are related, but they are not the same thing. A token can have a useful application while giving holders no claim on its revenue.`,`Before buying, identify the consensus method, supply schedule, use case, liquidity, holder concentration and custody process. A popular token can still have weak security, concentrated ownership or no durable demand.`],e:'If a token trades at €2 and 10 million units circulate, its approximate market capitalisation is €20 million. That measures size, not quality, safety or fair value.',c:['What does the network do in one sentence?','Who can issue tokens or change the rules?','How would I store it and recover access?','What fact would invalidate my thesis?'],x:'Choose one cryptocurrency. Write its network, asset, use, supply, main holders, custody method and three risks. Mark each fact as verified, assumed or unknown.',src:['https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/understand_risks_of_virtual_currency.html','CFTC: Understand virtual-currency risks']},
    l2:{t:'What does it mean to buy company stock?',s:'Buying a stock gives you an ownership claim in a company. Your return may come from a higher share price, dividends or both, but neither is guaranteed. A stock is a claim on a business, not a fixed deposit.',g:[`Study how the company makes money, what it sells, who pays it and what costs or competitors could weaken it. Revenue growth is not enough if margins, cash flow or the balance sheet deteriorate.`,`Share prices also reflect expectations. A strong company can fall when results disappoint or when investors decide future growth is already priced in. Read financial statements and valuation assumptions instead of relying on a familiar brand.`],e:'If a company earns €100 million and has 10 million shares, earnings are €10 per share. A market multiple of 15 would imply €150 per share before considering debt, growth and uncertainty. This is an illustration, not a forecast.',c:['What does the company sell and how does it earn?','Are revenue, margins and cash flow improving?','What debt, competition or regulation matters?','What valuation am I paying for realistic results?'],x:'Read one annual or quarterly report. Write three facts, two assumptions and one unanswered question before opening the price chart.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Introduction to investing']},
    l3:{t:'Why invest in gold and other metals?',s:'Gold, silver and other metals can have diversification or industrial uses, but they are not automatically safe. Prices respond to interest rates, currencies, supply, industrial demand, investor flows and the cost of owning the chosen product.',g:[`Physical bullion adds premiums, storage, insurance, authenticity and selling-spread costs. Funds and exchange-traded products may be easier to trade, but you must know whether they hold metal, use derivatives or rely on another institution. Mining shares are businesses, not the metal itself.`,`Decide the role before buying: diversification, a liquidity reserve, an inflation concern or a macroeconomic view. Gold may not produce income and silver or industrial metals can behave more like cyclical commodities.`],e:'If you pay a 5% premium on €1,000 of coins and later face a 4% dealer spread, the metal must rise by more than those costs before you break even.',c:['What exactly am I buying?','What are the premium, storage and selling costs?','What job should this position perform?','Could I tolerate years without a return?'],x:'Compare physical metal, a fund and a mining share. Record structure, costs, liquidity, custody and the risk that is missing from the headline price.',src:['https://www.investor.gov/introduction-investing/getting-started/asset-allocation','Investor.gov: Asset allocation']},
    l4:{t:'Crypto vs stocks: what is the difference?',s:'Stocks represent ownership in companies; cryptocurrencies are digital assets native to networks or protocols. The two markets share volatility and fraud risk, but custody, legal rights, cash flows, governance and market structure can be very different.',g:[`A stock may provide rights defined by company law, such as voting or a claim on declared dividends. A token may provide network access or governance, but its rights depend on code and the specific design. Neither category guarantees profit.`,`Crypto adds wallet, private-key, smart-contract and protocol risks. Stocks add business, accounting and issuer risks. Compare the claim you own and the way you can lose money, not only the historical chart.`],e:'€1,000 in one stock depends on one company. €1,000 in one token depends on one protocol, market and custody setup. The label alone does not determine suitable size.',c:['What do I own and what rights does it provide?','What produces demand or cash flow?','Who holds the asset and who can freeze access?','Which risk could cause a total loss?'],x:'Make a two-column comparison for one stock and one crypto asset: ownership, cash flow, liquidity, custody, regulation, fees and worst case.',src:['https://www.finra.org/investors/insights/crypto-investing','FINRA: Crypto investing']},
    l5:{t:'What is market capitalization?',s:'Market capitalisation is a size measure: price multiplied by shares or tokens considered in circulation. It helps compare assets, but it is not cash in the project, intrinsic value, liquidity or the amount you could sell without moving the market.',g:[`For stocks, market cap normally uses shares outstanding. Crypto websites may use circulating supply that excludes locked or vested tokens. Fully diluted valuation applies today’s price to a larger possible supply and can reveal future dilution.`,`A low market cap can grow quickly, but it can also be easier to manipulate and harder to exit. Check unlocks, treasury wallets, holder concentration and whether the displayed price comes from reliable markets.`],e:'Token A at €0.10 with 1 billion circulating tokens has a €100 million market cap. Token B at €10 with 5 million tokens has a €50 million market cap. Unit price alone says little.',c:['Which supply number is being used?','How many units can be issued later?','Who owns the largest balances?','Could I exit near the displayed quote?'],x:'Calculate the market cap of three assets and compare their circulating supply, fully diluted value, unlocks and trading volume.',src:['https://www.investor.gov/introduction-investing/investing-basics/investment-products','Investor.gov: Investment products']},
    l6:{t:'What does “volatility” mean?',s:'Volatility describes how widely and quickly a price moves. It is not identical to risk, but high volatility makes losses, forced decisions and poor execution more likely. The practical response is smaller sizing and preparation, not perfect prediction.',g:[`Historical volatility describes past movement; implied volatility reflects expectations embedded in some options. Neither predicts the future perfectly. Liquidity can disappear during news, outages or liquidations, creating gaps and slippage.`,`Define the loss you can tolerate before entering. A position should be small enough that a normal adverse move does not make you abandon your process or use money needed for essentials.`],e:'A €500 position falling 20% becomes €400. Recovering from €400 to €500 requires a 25% gain, not 20%. Drawdown control matters more than celebrating a percentage gain.',c:['What move would change my decision?','What happens if execution is worse than the quote?','Is my size small enough to think clearly?','Can I fund the position without borrowing?'],x:'Record the largest daily move of one asset over a chosen period. Choose a simulated size that would let you tolerate that move without breaking your rules.',src:['https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/understand_risks_of_virtual_currency.html','CFTC: Virtual-currency risk advisory']},
    l7:{t:'What is inflation?',s:'Inflation is a sustained rise in the general price level, reducing what money can buy. Investors need to distinguish nominal returns from real returns and match the risk of an asset to the date when the money is needed.',g:[`A nominal return is the account balance change. A real return adjusts for inflation, and the result must also account for fees and taxes. Cash can lose purchasing power, but risky assets can also fall during inflationary periods.`,`Companies, bonds and commodities respond differently to rates, costs, demand and supply shocks. There is no single inflation-proof asset; diversification and a suitable time horizon matter more than a slogan.`],e:'If €10,000 grows to €10,600 while prices rise 4%, its purchasing power is about €10,192 before fees and taxes. The nominal increase hides a much smaller real gain.',c:['When will I need this money?','Am I measuring after inflation, fees and tax?','Could this asset fall even if inflation rises?','Does the portfolio fit the time horizon?'],x:'Choose a future expense. Estimate its cost, a possible inflation rate and the risks of two ways to fund it. Keep the estimate separate from certainty.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Introduction to investing']},
    l8:{t:'What are fees and why do they matter?',s:'Fees reduce returns whether a trade wins or loses. The full cost can include commission, spread, slippage, funding, custody, withdrawal charges, currency conversion and taxes. A low headline commission may hide a wider spread.',g:[`A spread is the gap between visible buy and sell prices. Slippage is the difference between expected and actual execution. Thin liquidity means a displayed quote may not be available for your order size. Derivatives can add funding or financing over time.`,`Frequency compounds costs against you. Ask for the all-in cost of entering, holding, exiting and converting back to your currency. Compare the same transaction size across providers.`],e:'A 1% cost on €10,000 is €100. If entry and exit each cost 1%, the round trip can consume about €200 before the market moves.',c:['What is the cost to buy, hold and sell?','Is the quote delayed or liquid enough?','Are funding and conversion costs included?','How much return must cover costs?'],x:'Compare two providers for a hypothetical €1,000 round trip. Record commission, spread, conversion, withdrawal and holding costs.',src:['https://www.investor.gov/introduction-investing/getting-started/asset-allocation','Investor.gov: Investing costs']},
    l9:{t:'What is an exchange?',s:'An exchange matches buyers and sellers or offers its own liquidity. It may also custody your assets, adding platform and operational risk to normal market risk. A polished app is not proof of strong controls.',g:[`Check the legal entity, countries served, fees, withdrawal limits, security history, reserve disclosures and customer support. Use the official domain and read the terms before depositing. Trading frequently, buying periodically and holding long term have different needs.`,`Test a small deposit and withdrawal. Understand whether assets are segregated, how insolvency is handled and whether your country’s rules protect you. Diversifying providers can reduce concentration but adds complexity.`],e:'If an exchange pauses withdrawals, the market price may be irrelevant because access is the immediate risk. Custody is part of the investment decision.',c:['Is the provider authorised or registered where I live?','Can I test a small withdrawal?','What happens if the platform fails?','Which alerts and account limits are available?'],x:'Create an exchange scorecard with security, regulation, fees, liquidity, withdrawals, custody and support. Mark unknowns as unknown.',src:['https://www.finra.org/investors/insights/crypto-investing','FINRA: Crypto investing']},
    l10:{t:'What is a wallet?',s:'A crypto wallet uses the private keys that authorise transactions on a blockchain. It does not hold coins like a physical wallet. Losing the key or exposing the recovery phrase can mean losing control of the assets.',g:[`Custodial wallets are controlled by a service. Self-custody gives you the signing keys and the responsibility for backups, device security and transaction checks. Hot wallets are online; cold storage reduces online exposure but is less convenient.`,`A recovery phrase is a master key. Never share it, enter it into a site from a message or store it in a cloud note. Verify the address and network, then use a small test transfer before sending a meaningful amount.`],e:'Sending on the wrong network or to a mistyped address may be difficult or impossible to recover. A test transfer verifies address, network and destination.',c:['Who controls the private keys?','Where is the offline backup?','Have I tested recovery?','Do I verify addresses on a trusted device?'],x:'Write a custody plan without recording secrets: device, backup location, recovery test, emergency access and what support will never be allowed to see.',src:['https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins/crypto-asset-interest-bearing-accounts','Investor.gov: Crypto asset account risks']},
    l11:{t:'What is the Bitcoin “halving”?',s:'A Bitcoin halving reduces the block subsidy paid to miners under the protocol schedule. It changes the rate at which new bitcoin enters circulation; it does not guarantee a price increase or remove market, custody and network risks.',g:[`Mining revenue combines new-coin subsidy and transaction fees. When the subsidy falls, miners may sell reserves, improve efficiency or shut down. Markets often anticipate scheduled events, so any reaction depends on demand, liquidity, positioning and wider conditions.`,`Supply is only one variable. A historical pattern is not a reliable price forecast, and a protocol rule cannot tell you whether future demand will rise, stay flat or fall.`],e:'If miners receive 900 newly issued bitcoin per day and the subsidy portion halves, issuance falls substantially. That alone cannot produce a price target.',c:['Am I mistaking a rule for a guarantee?','What affects demand and liquidity?','How could miner economics matter?','What if the expected reaction does not happen?'],x:'Explain the halving in three sentences without using “bullish” or “guaranteed”. Then list three reasons price could move either way.',src:['https://bitcoin.org/bitcoin.pdf','Bitcoin whitepaper']},
    l12:{t:'What are stablecoins?',s:'Stablecoins aim to track a reference value such as the dollar or euro. Their stability depends on reserves, redemption, collateral, technology, issuer and liquidity. The name does not make the asset risk-free.',g:[`Some stablecoins use cash or short-term assets, some use crypto collateral and others use algorithms or incentives. Ask what can be redeemed, by whom, under which terms and how reserves are reported.`,`Even a widely used token can trade away from its target during stress. Frozen addresses, bank access, oracle errors, contract bugs or a congested network can affect redemption and transfers.`],e:'A stablecoin intended to equal €1 trading at €0.96 represents a 4% deviation. €1,000 of it is worth about €960 at that market price before fees.',c:['What backs the token?','Who can redeem it and under what terms?','Can administrators freeze or change supply?','Where is exit liquidity during stress?'],x:'Compare two stablecoins by issuer, reserve, redemption, chain, fees, transparency and failure scenario. Identify the risk you understand least.',src:['https://www.fca.org.uk/investsmart/5-questions-ask-you-invest-cryptoassets','FCA: Questions before crypto investing']},
    l13:{t:'How much money should I start investing with?',s:'There is no universal starting amount. Use money that is not needed for housing, bills, emergency savings or near-term goals, and choose a size small enough to learn without emotional pressure.',g:[`Map essential expenses, expensive debt, emergency cash and the date when you need the money. Money needed soon should not depend on a volatile asset being higher at the exact moment you need it.`,`Set a maximum loss, not only a deposit. Leverage can make losses exceed the initial amount. Starting small tests your process and behaviour; it does not make the asset safe.`],e:'If you can save €200 monthly after essentials, a €50 learning contribution may be manageable for one person and unsuitable for another. The budget and loss capacity decide the amount.',c:['Is emergency money separate?','Do I have expensive debt?','What loss would not change my life?','When will I need the money?'],x:'Build a one-page budget with essentials, emergency target, debt, savings and a learning amount. Explain why losing that amount would not affect essentials.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Introduction to investing']},
    l14:{t:'Is gold a safe investment right now?',s:'“Safe” depends on the goal and time horizon. Gold can diversify a portfolio, but its price can fall, it may not generate income and ownership costs or counterparty risks matter.',g:[`Gold responds to rates, currencies, real yields, central-bank activity and investor flows. Physical gold has storage and authenticity issues; funds and derivatives have provider and structure risks.`,`Decide the job before buying: diversification, liquidity reserve or a view on macro conditions. If you need growth or income, gold may not solve the problem. A position can suit one goal and fail another.`],e:'An investor buying after a sharp rise can face a falling price even when the long-term story remains intact. A target weight and review rule reduce headline-driven decisions.',c:['What risk am I trying to reduce?','What form and costs apply?','Can I tolerate years without a return?','How does it interact with other assets?'],x:'Write a job description for gold in your portfolio. Include its target weight, reason for holding and condition for reviewing it.',src:['https://www.investor.gov/introduction-investing/getting-started/asset-allocation','Investor.gov: Asset allocation']},
    l15:{t:'First steps so you don’t get lost',s:'A new investor does not need to predict markets. Start by understanding the product, choosing a trustworthy provider, protecting access, defining a goal and creating a repeatable process.',g:[`Learn a small vocabulary: asset, order, spread, custody, volatility, diversification and risk. Understand settlement before adding leverage, derivatives or DeFi. Use official provider pages and independent investor education.`,`Activate two-factor authentication, keep transaction records and reject urgency or guaranteed-return claims. Learning is a risk control, not a delay.`],e:'A useful first experiment is a simulated €100 allocation with a written reason, time horizon, maximum loss, fees, custody and review date.',c:['What is my goal and horizon?','Can I explain the product and worst case?','Is my account protected?','What evidence would make me stop?'],x:'Create a before-first-purchase checklist and refuse to buy until each answer is written. Review the checklist after one month.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Investor education']},
    l16:{t:'Common beginner mistakes',s:'Beginner losses often come from process errors: using essential money, copying others, ignoring costs, using excessive leverage, chasing performance and failing to plan custody or exits.',g:[`FOMO encourages late entries; loss aversion encourages holding or revenge trading. Screenshots rarely show losing periods, fees, risk or survivorship bias. These are predictable behaviours, so add friction before they occur.`,`Changing the asset, strategy, size and provider after every result prevents learning. Keep a journal with thesis, evidence, costs, outcome and review date.`],e:'A trader loses €30, doubles the next position to recover it and loses €60. The second trade was an emotional response, not a better idea. A daily loss limit would interrupt the escalation.',c:['Am I following a rule or an emotion?','Did I include costs and total-loss risk?','Is the source independent?','What stops one error becoming a series?'],x:'List five mistakes you are likely to make and one friction for each: smaller size, delay, withdrawal test, trade limit or journal.',src:['https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-alerts/crypto-asset-securities','Investor.gov: Crypto asset alert']},
    l17:{t:'Diversifying: not all eggs in one basket',s:'Diversification spreads exposure across investments whose risks do not move identically. It can reduce the damage from one failure, but it cannot guarantee profit or prevent all losses.',g:[`Ten tokens may still depend on one blockchain, exchange, stablecoin or narrative. Review concentration by issuer, sector, geography, network, custody and liquidity, not only by number of holdings.`,`The goal is not to own everything. It is to ensure one wrong assumption cannot destroy the plan. Narrow funds can also be concentrated despite holding many securities.`],e:'If one asset is 60% of a portfolio and falls 50%, the portfolio loses about 30% before other movements. At 10%, the same fall costs about 5%.',c:['What percentage depends on one network or provider?','Are the holdings genuinely different?','What is my maximum position weight?','Could holdings fall together?'],x:'Group your holdings by asset, issuer, network, sector and custody. Identify the largest dependency and one practical way to reduce it.',src:['https://www.investor.gov/introduction-investing/getting-started/asset-allocation','Investor.gov: Diversification']},
    l18:{t:'Technical vs fundamental analysis',s:'Technical analysis studies price, volume and market structure. Fundamental analysis studies the business, network, cash flows, users, competition and token design. Both organise hypotheses; neither provides certainty.',g:[`A technical question may concern trend, liquidity or execution. A fundamental question may concern durable revenue, users or token value capture. Keep the question separate from the prediction.`,`Signals fail during news and thin liquidity. Fundamental estimates fail when assumptions about growth, regulation or technology are wrong. Match evidence to the time horizon.`],e:'A token can break above a chart level while its supply is about to double. The chart describes behaviour; the unlock changes future supply.',c:['What exact question am I answering?','Is the evidence relevant to the horizon?','Which assumption matters most?','What would make me exit?'],x:'Write separate technical and fundamental notes for one asset. Compare their assumptions, time horizons and failure conditions.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Investing basics']},
    l19:{t:'What is a prop firm?',s:'A proprietary trading firm may offer a simulated or funded programme after an evaluation. The contract and rule set matter more than the advertised account size.',g:[`Check whether trading is simulated, how the firm earns revenue, whether fees are refundable, how violations are defined and how daily loss or drawdown is calculated. A €100,000 account may be notional and not money you own.`,`Rules may include targets, minimum days, news or overnight restrictions, consistency, copying limits and payout conditions. A strategy can work in a market and still fail the programme.`],e:'A €100,000 notional account with a 5% maximum drawdown has a €5,000 boundary. A 2% daily limit can end an evaluation after one volatile day.',c:['Is the account live, simulated or unclear?','How are loss limits calculated?','What are fees and payout conditions?','What legal identity and evidence exist?'],x:'Create a prop-firm term sheet: target, daily loss, total drawdown, minimum days, prohibited actions, fee, payout and failure scenario.',src:['https://www.fca.org.uk/investsmart/5-questions-ask-you-invest-cryptoassets','FCA: Due-diligence questions']},
    l20:{t:'Leverage and margin',s:'Leverage controls more market exposure than the cash posted as margin. It magnifies gains and losses, increases liquidation risk and may add funding costs. Buying power is not affordable risk.',g:[`If you post €100 and control €1,000, a 1% move changes the position by about €10 before costs, or 10% of margin. A move against you can trigger a margin call or liquidation before you can react.`,`Read maintenance margin, liquidation, fees and funding rules. Cross margin can expose more of an account; isolated margin limits assigned collateral but is not safe by itself.`],e:'A €1,000 position on €100 margin loses €20 after a 2% adverse move, reducing margin by 20% before fees. Gaps and thin liquidity can worsen it.',c:['What is my exposure, not deposit?','Where is liquidation?','What funding and interest apply?','Can other positions be affected?'],x:'Calculate the cash impact of 1%, 3% and 10% moves. Choose a simulated exposure that does not require a price rebound.',src:['https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/understand_risks_of_virtual_currency.html','CFTC: Leverage risk']},
    l21:{t:'Stop-loss and risk management',s:'A stop-loss is an instruction or rule intended to close a position at a chosen level. It can define planned risk, but it cannot guarantee an exact price during gaps, rapid markets, outages or low liquidity.',g:[`Set the invalidation level from the trade idea, then calculate position size from the distance to it. A stop that is too close can be normal noise; a stop that is too far can create an unacceptable loss.`,`Understand stop-market versus stop-limit. The first prioritises execution and may fill worse; the second controls price and may not fill. Include slippage and fees.`],e:'Entry €50, invalidation €47 and maximum loss €30 gives 10 units before costs. Moving the stop further without reducing size increases risk.',c:['What fact proves the idea wrong?','How much can slippage add?','Will the stop work during an outage?','What is the rule after a stop?'],x:'Choose a hypothetical entry and invalidation. Calculate size for three loss limits and explain why moving the stop changes the maths.',src:['https://www.finra.org/investors/investing/investment-products/stocks/order-types','FINRA: Order types']},
    l22:{t:'Drawdown and maximum loss',s:'Drawdown is the decline from a previous peak in balance or equity. It matters because recovery requires a larger percentage gain than the original loss and because rules may force a close.',g:[`A 10% loss needs an 11.1% gain to recover; a 50% loss needs 100%. Track realised and unrealised losses because programmes may use equity, not only closed trades.`,`Limits may be static, daily, total or trailing and may use a high-water mark. A profitable strategy can still breach a rule because of its path.`],e:'€10,000 falling to €8,000 is a 20% drawdown. Returning to €10,000 requires a 25% gain from €8,000.',c:['Which peak and value are compared?','Is the limit balance, equity or trailing?','What size stays below normal loss?','When do I stop trading?'],x:'Make a table for 5%, 10%, 20% and 40% losses, adding the recovery percentage and a behaviour rule for each level.',src:['https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/understand_risks_of_virtual_currency.html','CFTC: Risk advisory']},
    l23:{t:'Spot, futures and CFDs',s:'Spot trading generally involves the asset itself. Futures and CFDs are derivatives whose value references an asset without giving the same ownership. Derivatives add margin, financing, expiry, liquidation or counterparty risks.',g:[`With spot crypto, custody and network transfer are central. Futures may use leverage, funding or expiry. A CFD is a contract with a provider and may include financing; you normally do not own the underlying asset.`,`Ask how price is marked, who is counterparty, what collateral does, what happens during a gap and which protections apply in your country.`],e:'A €1,000 cash purchase can fall to €700 without margin liquidation. A €1,000 leveraged derivative can be closed after a smaller adverse move if collateral falls below its threshold.',c:['Do I own the asset or a contract?','What are margin and liquidation rules?','Who marks the price and is counterparty?','Is the product legal and suitable here?'],x:'Compare a spot product and derivative for the same asset by ownership, custody, leverage, fees, liquidation, expiry and provider risk.',src:['https://www.cftc.gov/LearnAndProtect/AdvisoriesAndArticles/understand_risks_of_virtual_currency.html','CFTC: Derivative and leverage risks']},
    l24:{t:'How to compare a prop firm',s:'Compare prop firms by survivable rules, total cost and payout reliability, not by the largest advertised account. Two readers should be able to calculate the same result from the terms.',g:[`Record evaluation price, target, daily loss, total drawdown, static or trailing calculation, minimum days, size, news and overnight rules, platform and payout conditions. Check whether rules change between stages.`,`Verify the legal company, support channels, terms and complaint process. A screenshot or testimonial is not audited performance. Treat vague wording as an unresolved risk.`],e:'Firm A may charge €50 with a 10% target and 5% drawdown; Firm B €80 with an 8% target and 4% drawdown. Strategy fit and payout rules decide the comparison.',c:['Can I calculate every limit?','Does my strategy fit the restrictions?','What is the complete cost?','How is reliability independently checked?'],x:'Put two firms side by side. Mark each rule clear, restrictive or unknown, and resolve every unknown from the official agreement.',src:['https://www.fca.org.uk/investsmart/5-questions-ask-you-invest-cryptoassets','FCA: Due diligence']},
    l25:{t:'Recognising scams and misleading claims',s:'Scams combine urgency, authority, social proof and promises of low risk or guaranteed profit. Slow down, verify the person and company independently, and never send keys or money to unlock a withdrawal.',g:[`Red flags include unexpected contact, only winning results, pressure to act, fixed returns, crypto-only payment, recovery-fee demands and a tax or fee required before withdrawal. A realistic dashboard can be fabricated.`,`Type the provider’s domain yourself, check official registers where relevant and contact support through a trusted route. Do not trust the link or phone number supplied by the promoter.`],e:'If a platform says €2,000 of profit is locked until you pay €300 in “verification crypto,” stop. Do not send more. Preserve evidence and contact your bank or exchange quickly.',c:['Who contacted me and how can I verify them?','Are returns guaranteed or unusually consistent?','Can I withdraw without a new payment?','Am I asked for a secret or remote access?'],x:'Take one investment offer and write its claim, evidence, conflict, legal identity, withdrawal process and worst case. Mark promoter-supplied evidence as unverified.',src:['https://consumer.ftc.gov/articles/what-know-about-cryptocurrency-scams','FTC: Cryptocurrency scam advice']},
    l26:{t:'Trading psychology',s:'Trading psychology is behaviour under uncertainty. Discipline is not never feeling fear; it is designing rules so emotion has less control over size, frequency and exits.',g:[`FOMO leads to late entries, loss aversion keeps bad positions open and revenge trading tries to repair a loss with a larger risk. Add friction: pre-written criteria, a maximum number of trades, a daily loss limit, breaks and a journal.`,`If you cannot follow the rules, reduce size or stop. A strategy that requires perfect emotional control is not robust at the current size.`],e:'After two losses, doubling the next position is not a better idea. A rule to stop for the day, record the trades and review after a break protects decision quality.',c:['What emotion changes my size?','What creates a pause before an impulse?','Do I review losses honestly?','Is size small enough to think clearly?'],x:'Write an if-then plan for three triggers: “If I feel X, I will do Y before placing another order.” Test it in simulation.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Investor education']},
    l27:{t:'Building a trading plan',s:'A trading plan turns a market opinion into rules that can be tested. It should define market, setup, entry, invalidation, exit, size, costs, schedule, maximum loss and review process.',g:[`Define when you will and will not trade: asset, timeframe, liquidity, news and allowed instruments. State the evidence required and the fact that proves the idea wrong.`,`Size from risk, not platform buying power. Record spread, slippage, funding and tax treatment. Review a meaningful sample and change one variable at a time.`],e:'A plan can risk €10, require two defined conditions, stop at invalidation, allow three trades daily and review after 30 trades. The value is consistency, not a perfect win rate.',c:['What creates an entry?','Where is the idea wrong?','What ends the session?','What data will I record?'],x:'Write a one-page simulated plan. Paper trade it, record exceptions and revise only after reviewing the whole sample.',src:['https://www.finra.org/investors/investing/investment-products/stocks/order-types','FINRA: Order types']},
    l28:{t:'How to keep crypto safe',s:'Crypto security is a chain: email, device, exchange, wallet, private key and transaction approval. One weak link can expose funds, and a shared seed phrase cannot be recovered by customer support.',g:[`Use a unique password, password manager, strong two-factor authentication, updates, screen lock, withdrawal alerts and allowlists where available. Consider cold storage for long-term funds only if you can manage recovery safely.`,`Separate everyday use from long-term custody. Bookmark official sites, inspect domains, verify transaction details and keep recovery backups offline. After a suspected compromise, use a clean device and act quickly.`],e:'If a message says your exchange closes in ten minutes, open the bookmarked exchange yourself and inspect alerts. Urgency is a reason to verify, never a reason to skip verification.',c:['Is email protected separately?','Where is the offline recovery backup?','Do I verify contracts and networks?','What happens if my device is lost?'],x:'Draw the path from email to withdrawal. Mark each attack point and add one control: 2FA, update, backup, allowlist, test transfer or cold storage.',src:['https://consumer.ftc.gov/articles/what-know-about-cryptocurrency-scams','FTC: Crypto safety advice']},
    l29:{t:'What is DeFi?',s:'Decentralised finance uses smart contracts and blockchains for swaps, lending and liquidity without a traditional intermediary. Removing an intermediary changes risk; it does not remove it.',g:[`Understand the contract, assets, oracle, admin keys, fees, liquidation and liquidity before connecting a wallet. Audits can find some bugs but do not guarantee safety, honest governance or sustainable economics.`,`Risks include code bugs, oracle manipulation, bridge failure, impermanent loss, bad debt, governance attacks, front-running, phishing and irreversible transactions. Read documentation and test with a small amount.`],e:'A lending protocol may liquidate collateral when a health threshold is crossed. An oracle failure or sudden move can make liquidation occur at a poor price.',c:['What contract and address will I use?','Who can upgrade or pause it?','What if oracle or liquidity fails?','What is the complete worst-case loss?'],x:'Map one protocol’s funds, price feeds, admin powers, withdrawal path, fees and failure mode. If you cannot trace the flow, do not deposit.',src:['https://ethereum.org/use-cases/defi/','Ethereum.org: DeFi']},
    l30:{t:'Stablecoins: how to evaluate them',s:'Evaluate the promise behind a stablecoin’s peg: backing, redemption, reporting, contract permissions, liquidity and behaviour under stress.',g:[`Identify issuer, reserve assets, storage, reports and direct redemption rights. Inspect mint, burn, pause and freeze powers on the blockchain contract. Then check depth across venues and networks.`,`A token can look stable in normal conditions and become expensive or impossible to exit during stress. Include chain congestion, bridge exposure, fees and acceptance where you need to use it.`],e:'A token may trade at $1 on one venue and $0.97 on another because liquidity is fragmented. An average price does not guarantee redemption at par.',c:['What legal claim does a holder have?','How are reserves reported?','Can supply or addresses be changed?','Where can I exit during stress?'],x:'Make a stablecoin risk card with issuer, reserve, redemption, permissions and exit liquidity. Update it when any fact changes.',src:['https://www.fca.org.uk/investsmart/5-questions-ask-you-invest-cryptoassets','FCA: Cryptoasset questions']},
    l31:{t:'What is Bitcoin?',s:'Bitcoin is a decentralised digital-currency protocol with a public transaction history and software-defined issuance. It enables value transfer without a central ledger operator, but users still face price, custody, network and fraud risks.',g:[`Users control addresses through private keys. Transactions are broadcast, checked and added to blocks under proof-of-work consensus. Confirmations make reversal harder, so address accuracy and custody are essential.`,`Limited issuance is a protocol property, not guaranteed purchasing power. Price depends on demand, liquidity, regulation, macro conditions, competition and confidence in the network.`],e:'A single incorrect character in a destination address can send funds somewhere the network cannot interpret as a mistake. Verify first and test with a small amount.',c:['Can I explain keys, addresses and confirmations?','How will I custody bitcoin?','What fees and confirmation policy apply?','What makes it unsuitable for my goal?'],x:'Read the Bitcoin whitepaper introduction. Explain the problem it addresses, what it does not guarantee and three user risks.',src:['https://bitcoin.org/bitcoin.pdf','Bitcoin whitepaper']},
    l32:{t:'What is Ethereum?',s:'Ethereum is a public blockchain platform for smart contracts and applications. Ether, or ETH, is its native asset used for fees, staking and transfers. Ethereum the network and ETH the asset are not the same term.',g:[`Smart contracts are programs deployed on-chain. Users submit transactions, validators process them and gas fees help compensate the network and limit spam. Fees change with demand; a transaction can fail while still consuming gas.`,`Applications inherit risks from code, permissions, oracles, bridges and interfaces. ETH price risk is separate from losing funds through a bad contract interaction.`],e:'A transaction can be valid but uneconomic if gas exceeds the value moved. Check network, contract, fee estimate and slippage before signing.',c:['Am I on the correct network?','What permission am I granting?','How will gas affect the result?','Can I revoke approvals?'],x:'Draw the path from wallet signature to contract state change. Label fees, permissions and irreversible steps.',src:['https://ethereum.org/what-is-ethereum/','Ethereum.org: What is Ethereum?']},
    l33:{t:'How does blockchain work?',s:'A blockchain is a replicated record updated by a network following agreed rules. Blocks group transactions, hashes link records and consensus decides which valid history is accepted.',g:[`A wallet signs a transaction; nodes check it; a block producer includes it; other nodes validate the block. More confirmations can reduce reversal risk depending on the network.`,`Proof of work, proof of stake and other systems make different trade-offs around security, cost, finality and participation. A blockchain records data; it does not make the input true or the application safe.`],e:'A transaction visible on an explorer may not yet satisfy a merchant’s confirmation policy. High-value transfers need the network’s required finality, not just a visible hash.',c:['Who validates transactions?','What does one confirmation mean here?','Is recorded data actually verified?','What if the app or oracle is wrong?'],x:'Explain a transaction using sign, broadcast, validate, include and confirm. Add one risk at each step.',src:['https://ethereum.org/what-is-the-ethereum-network/','Ethereum.org: The Ethereum network']},
    l34:{t:'What is staking?',s:'Staking commits an asset to help secure or operate a proof-of-stake network. Rewards follow protocol and service rules; they are not guaranteed interest. Price falls, lockups, slashing and provider risk can outweigh rewards.',g:[`Native staking involves validators following protocol rules. Delegating through an exchange or liquid-staking protocol adds fees, smart-contract, governance and custody risks. Understand keys, unbonding and withdrawals.`,`Reward rates can change as participation, issuance or fees change. A reward token can fall in value. Separate real fees from newly issued tokens when judging sustainability.`],e:'A 5% token reward on €1,000 is 50 units only if the token price stays constant. A 30% price fall can outweigh that reward and any lockup cost.',c:['What is my role in securing the network?','How long are funds locked?','What causes slashing or loss?','Are rewards fees or new issuance?'],x:'Make a staking table with reward, provider fee, lockup, price scenarios, exit delay and failure risks.',src:['https://ethereum.org/staking/','Ethereum.org: Staking']},
    l35:{t:'What is a crypto token?',s:'A token is a digital asset issued on a blockchain or network. Its name and price do not tell you what rights it provides. Read the contract, distribution, supply schedule, holders and actual use.',g:[`Tokens can represent access, governance, application claims, points or speculation. A whitepaper states intentions; the contract and real usage are stronger evidence.`,`Study insider allocation, unlocks, emissions, treasury control, transfer restrictions, minting powers, liquidity and holder concentration. Useful technology does not guarantee that the token captures value.`],e:'If insiders hold 70% with upcoming unlocks, rising demand may be absorbed by future selling. Application quality and token price can diverge.',c:['What right or utility exists?','How is supply created or unlocked?','Who can mint or change rules?','Does usage create token demand?'],x:'Create a tokenomics table with supply, allocation, unlocks, utility, governance, liquidity and contract permissions. Mark marketing claims.',src:['https://ethereum.org/what-is-ethereum/','Ethereum.org: Smart-contract ecosystem']},
    l36:{t:'What is a smart contract?',s:'A smart contract is code deployed on a blockchain that executes when called. It can reduce reliance on an intermediary, but bugs, permissions and flawed economics can make actions irreversible.',g:[`Identify what the contract can do before approving or depositing. Unlimited approvals, admin keys and upgrade functions can create large losses. An audit is useful evidence, not insurance.`,`Use verified addresses from official documentation, inspect transaction simulations, test small and revoke unused approvals. A technically correct contract can still be economically unsafe.`],e:'Approving a contract to spend only the intended amount limits damage compared with an unlimited approval if the contract or front end is compromised.',c:['What function am I calling?','What permission am I granting?','Who can upgrade or pause it?','Can I revoke approval and exit?'],x:'List every permission from wallet connection to final transfer in a simulated swap. Identify the irreversible step and smallest safe test.',src:['https://ethereum.org/developers/docs/smart-contracts/','Ethereum.org: Smart contracts']},
    l37:{t:'What is a DAO?',s:'A DAO is a community or organisation coordinated partly through blockchain governance. The label does not guarantee decentralisation; voting power, delegation, treasury control and upgrade keys determine practical control.',g:[`Check who can propose, vote and execute, how quorum works and whether votes are token-weighted. A small group, multisig or foundation may control outcomes while thousands hold tokens.`,`Treasuries face contract, signer and proposal risk. A vote can also be technically valid but legally unclear. Read the proposal, turnout, conflicts and execution path.`],e:'A proposal with 60% approval may have received votes from only 2% of total supply. “Approval among votes cast” is not broad participation.',c:['Who can propose, vote and execute?','How concentrated is voting power?','Can admins override decisions?','What legal and treasury risks remain?'],x:'Read one governance proposal and summarise change, voters, quorum, execution, conflicts and downside if it passes.',src:['https://ethereum.org/dao/','Ethereum.org: DAOs']},
    l38:{t:'What is a crypto bridge?',s:'A bridge moves or represents an asset between blockchain networks. It may lock assets on one chain and mint a representation on another, or rely on liquidity and messaging systems. It adds several failure points.',g:[`Ask whether the destination token is native or wrapped, who controls locked collateral, how messages are verified and what happens when a chain pauses.`,`A bridge can be secure yet expose users to a fake token, wrong network, insufficient liquidity or compromised front end. Verify route, addresses and representation, then test a small transfer.`],e:'On Chain B you may hold a wrapped representation, not the original asset on Chain A. If collateral cannot be unlocked, the wrapper can lose value.',c:['What is locked, minted or transferred?','Who verifies the cross-chain message?','What if a signer or chain fails?','Is there exit liquidity?'],x:'Draw source asset, lock contract, validators, destination token and redemption path. Mark the single-point failures.',src:['https://ethereum.org/bridges/','Ethereum.org: Bridges']},
    l39:{t:'What is a liquidity pool?',s:'A liquidity pool holds assets so an automated market maker can quote swaps. Liquidity providers earn fees or incentives, but face price divergence, slippage, smart-contract risk and difficult exits.',g:[`In a constant-product pool, trader swaps change the asset balances. When prices diverge, arbitrageurs rebalance the pool and the provider can hold more of the weaker asset. This difference from holding both is commonly called impermanent loss.`,`Fees may offset it, but only if volume and fee share are sufficient. Check reserves, volume, fees, contract, incentive emissions and withdrawal behaviour.`],e:'Providing equal ETH and stablecoin value can leave you with less ETH than simply holding both after ETH doubles. Fee income may or may not compensate.',c:['What assets and formula are used?','How are fees shared?','What happens when prices diverge?','Can liquidity be withdrawn under stress?'],x:'Model a two-asset pool after a 2x price change. Compare liquidity provision with holding and list the contract and exit risks.',src:['https://ethereum.org/defi/','Ethereum.org: DeFi']},
    l40:{t:'What is yield farming?',s:'Yield farming moves capital through DeFi strategies to earn fees, interest, token incentives or leverage. APY is not guaranteed and may hide dilution, price, liquidity, contract and counterparty risks.',g:[`Ask where return comes from: user fees, borrower interest, new emissions, a temporary campaign or leverage. A high rate funded by new tokens can collapse when incentives end or the reward token falls.`,`Compare net return after gas, slippage, platform fees, taxes and exit costs. If yield cannot be explained as cash flows and risks, it is not understood.`],e:'A 40% APY paid in a token that falls 50%, with 5% costs, can produce a negative euro result despite the headline rate.',c:['What pays the yield?','Is it sustainable demand or emissions?','Which contracts and bridges are involved?','What happens when liquidity falls?'],x:'Rewrite one offer as a cash-flow statement: deposit, fees, rewards, price assumption, gas, exit and failure scenarios.',src:['https://ethereum.org/use-cases/defi/','Ethereum.org: DeFi']},
    l41:{t:'What is a bull market?',s:'A bull market is a sustained period of rising prices and optimistic expectations. It can make weak decisions look smart because many assets rise together, encouraging excess exposure and certainty.',g:[`Rising prices can reflect improved fundamentals, liquidity, short covering or speculation. They do not prove every project is sound. Bull markets also attract aggressive marketing and scams.`,`Define allocation limits, rebalancing and profit or risk rules before excitement peaks. Treat unrealised gains as uncertain capital and avoid adding leverage because confidence feels high.`],e:'€1,000 growing to €1,800 and then falling 50% leaves €900. An exposure limit can prevent a gain from becoming a larger-than-original loss.',c:['Has exposure exceeded the plan?','What evidence exists apart from momentum?','What after a 30% or 50% fall?','Am I using leverage because of emotion?'],x:'Write a bull-market policy: maximum allocation, leverage rule, rebalancing date, cash needs and stop-adding conditions.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Market basics']},
    l42:{t:'What is dollar-cost averaging?',s:'Dollar-cost averaging invests a fixed amount on a schedule instead of committing planned capital at once. It reduces pressure to choose one entry price, but it does not guarantee profit or outperform investing earlier in a rising market.',g:[`A fixed euro contribution buys more units when price is lower and fewer when higher. The asset can still decline for a long time or become worthless, so DCA is a behaviour and cash-flow method, not a safety feature.`,`Define schedule, fees, allocation limit, review date and stopping conditions. Do not use DCA to avoid admitting that the investment thesis changed.`],e:'€100 at prices €10, €5 and €20 buys 10, 20 and 5 units: 35 for €300, an average cost of about €8.57 before fees.',c:['Why this asset and horizon?','What if the thesis changes?','Are fees small for each contribution?','Does the plan fit cash flow?'],x:'Build a 12-month DCA plan with amount, date, fees, allocation, review criteria and a rule for stopping contributions.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Saving and investing']},
    l43:{t:'What is a limit order?',s:'A limit order buys or sells only at a specified price or better. It controls price but not execution. A market order prioritises execution but can fill unexpectedly in a fast or thin market.',g:[`A limit buy can remain unfilled or partially fill. Check time-in-force, post-only rules and whether it persists after a session. A stale order can execute after the original reason is gone, so cancel orders that no longer fit.`,`A limit price does not remove asset risk: negative news can arrive immediately after the fill. Execution is always a trade-off between price control and certainty.`],e:'With a €20.10 sell price and €19.90 buy price, a €19.90 limit buy controls the maximum but may not fill; a market buy may fill at €20.10 or worse.',c:['Do I value price control over speed?','What about gaps or partial fills?','When does the order expire?','Will the reason still exist later?'],x:'Use a simulated order book for market, limit and stop orders. Record spread, fill status, execution and new risks.',src:['https://www.finra.org/investors/investing/investment-products/stocks/order-types','FINRA: Order types']},
    l44:{t:'What is technical analysis?',s:'Technical analysis uses historical price and volume to describe behaviour and build trade hypotheses. It can help plan entries and exits, but patterns are not laws and can fail when liquidity, news or regime changes.',g:[`Start with one question: trend, range, volatility, liquidity or execution. Define indicators before looking at the result. A moving average or oscillator transforms past data; it does not create certainty about the future.`,`Backtest with realistic spread, fees, slippage, missed fills and delisted assets. Avoid changing parameters until the historical result looks attractive; that is overfitting.`],e:'A breakout on low volume with a widening spread may be less actionable than a move supported by deep liquidity. The chart cannot guarantee execution.',c:['What exact behaviour am I testing?','What data and sample are used?','Are costs and missed fills included?','When is the signal unreliable?'],x:'Write a chart rule with entry, exit, invalidation and no-trade conditions. Test it on data not used to create it.',src:['https://www.finra.org/investors/investing/investment-products/stocks/order-types','FINRA: Trading basics']},
    l45:{t:'What is fundamental analysis?',s:'Fundamental analysis studies what supports an asset’s value: business cash flow, network activity, users, competition, incentives and risks. It is useful only when evidence and assumptions are explicit enough to challenge.',g:[`For a company, study revenue quality, margins, cash flow, debt, management and valuation. For a protocol, study users, fees, security, treasury, token supply, governance and value capture.`,`Separate data from forecasts. Address counts may include bots; high fees may be temporary. Compare periods and competitors and identify the assumption with the greatest impact.`],e:'A protocol with €1 million monthly fees is not automatically better than one with €100,000. Ask who receives fees, what costs create them and whether holders capture value.',c:['What measurable activity supports value?','How durable are revenue or users?','Who captures value and bears risk?','Which assumption matters most?'],x:'Write a one-page memo with facts, assumptions, valuation range, catalysts, risks, disconfirming evidence and review date.',src:['https://www.investor.gov/introduction-investing','Investor.gov: Investing basics']},
    l46:{t:'What is portfolio rebalancing?',s:'Rebalancing restores a portfolio toward target allocations after prices or contributions change. It keeps risk connected to the plan, but creates costs, taxes and the possibility of selling a winner.',g:[`Choose target weights, review schedule and tolerance bands before the next market move. Calendar and threshold rules can both work; new contributions may rebalance without selling.`,`First check whether the target still fits the goal and loss capacity. Rebalancing an unsuitable allocation only preserves an unsuitable plan. Include spreads, commissions, tax and liquidity.`],e:'A 60/40 portfolio becoming 75/25 after a rally can be restored by selling the overweight side or directing new contributions to the underweight side.',c:['What are targets and bands?','When will I review?','Can contributions reduce trading?','Does the target still fit?'],x:'Create a three-asset rule and test 20% rise and 30% fall scenarios including fees and the local tax question.',src:['https://www.investor.gov/introduction-investing/getting-started/asset-allocation','Investor.gov: Rebalancing']},
    l47:{t:'How do crypto taxes work?',s:'Crypto tax treatment depends on country, residence, asset, transaction and activity. Buying, selling, swapping, staking, mining, receiving payment and moving between your own wallets may be treated differently.',g:[`Keep date, asset, quantity, fiat value, fees, wallet or exchange, transaction type and transaction ID. Export statements regularly because platforms may not retain every record. Label transfers between your own wallets clearly.`,`Rules and reporting duties change. Use your tax authority’s guidance and a qualified professional for frequent trading, DeFi, rewards or cross-border activity. This article cannot give a personal tax answer.`],e:'A token-to-token swap may be treated as a disposal in some jurisdictions even when no euros are withdrawn. Without acquisition cost and timestamp, later calculations become guesswork.',c:['Which country’s rules apply?','Do I have records from every wallet and provider?','Have I separated trades, transfers and rewards?','What changed this tax year?'],x:'Create one row per transaction with the fields above and reconcile it to provider statements before filing or asking a professional.',src:['https://www.gov.uk/government/collections/cryptoassets-tax-for-businesses','Official crypto tax guidance example; check your own authority']},
    l48:{t:'How to avoid crypto phishing scams',s:'Phishing copies exchanges, wallets or support teams to steal credentials, recovery phrases or transaction approvals. The strongest defence is verifying the route before clicking and limiting what a compromised account can do.',g:[`Avoid links from unsolicited messages, search ads, fake support accounts and urgent pop-ups. Type the domain or use a trusted bookmark, inspect spelling and check that the action matches your intent. Legitimate support does not request a seed phrase.`,`Use passkeys or strong two-factor authentication, separate email security, withdrawal alerts and allowlists. If a wallet is compromised, stop signing, preserve evidence and move assets from a clean device if possible.`],e:'A fake site can show the correct logo. Visual similarity is not verification; the safe test is a trusted route and an independent confirmation of the request.',c:['Did I use a trusted bookmark or typed domain?','Is the sender asking for a secret or urgency?','What will this signature approve?','What is my response plan after exposure?'],x:'Inspect three messages without clicking. Identify sender, domain, request, urgency and independent verification. Report or delete failures.',src:['https://consumer.ftc.gov/articles/what-know-about-cryptocurrency-scams','FTC: Crypto scam advice']},
    l49:{t:'What is a rug pull?',s:'A rug pull is an exit scam in which operators remove value after attracting users, often by withdrawing liquidity, selling concentrated holdings or exploiting hidden permissions. Not every failure is a rug pull, but warning signs can be investigated.',g:[`Check holder concentration, deployer and admin permissions, liquidity ownership and lock terms, mint or blacklist functions, upgradeability, team identity and verified code. An audit does not prove honesty or economics.`,`Test selling a small amount and measure slippage. Be cautious with unrealistic returns, urgency and communities that discourage questions. Locked liquidity does not prevent insider selling or another contract exploit.`],e:'Thousands of holders do not prove broad ownership. A linked group controlling most supply can sell into shallow liquidity and leave others unable to exit near the displayed price.',c:['Who controls contracts and largest balances?','Can liquidity be removed or supply increased?','Can I sell a small test amount?','Are team and claims independently verifiable?'],x:'Create a risk report for one project: ownership, liquidity, permissions, unlocks, team, sell test, promises and unknowns.',src:['https://consumer.ftc.gov/articles/what-know-about-cryptocurrency-scams','FTC: Crypto investment scams']},
    l50:{t:'How to build a long-term investing routine',s:'A durable investing routine is built around goals, time horizon, savings, allocation, research, custody, records and scheduled reviews. It replaces constant prediction with a process that makes risk visible and decisions repeatable.',g:[`Write the goal, amount, date and flexibility first. Choose an allocation you could hold through a difficult market. Automate only what you understand and can stop when circumstances change.`,`Use a research checklist: what do I own, why might it have value, what can go wrong, what does it cost, who holds it and when will I review it? Compare results with your original reasoning, not only the latest price.`],e:'A monthly routine might include one contribution, a short fee and allocation review, a quarterly security check and an annual goal review. The calendar matters less than consistency.',c:['What goal, amount and date matter?','What loss could I tolerate?','Are custody and records safe?','What triggers a review instead of panic?'],x:'Write a one-page investment policy with goals, horizon, savings, allocation, concentration limit, custody, review dates and stop conditions.',src:['https://www.investor.gov/additional-resources/general-resources/publications-research/info-sheets/beginners-guide-asset','Investor.gov: Beginner’s guide to asset allocation']}

  <script>
  (()=>{
    const all=window.INVESTINGNOOBS_LONGFORM||{},id=new URLSearchParams(location.search).get('id')||'',content=all[id],article=document.getElementById('article');
    if(!content||!article||article.querySelector('.longform'))return;
    const block=document.createElement('section');block.className='longform';block.setAttribute('aria-labelledby','longform-heading');
    const kicker=document.createElement('p');kicker.className='longform-kicker';kicker.textContent='Long-form explainer';block.appendChild(kicker);
    const heading=document.createElement('h2');heading.id='longform-heading';heading.textContent='The full guide';block.appendChild(heading);
    const intro=document.createElement('p');intro.className='longform-intro';intro.textContent='Read this lesson as a chapter: understand the mechanism, test the assumptions and apply the idea with a clear risk limit.';block.appendChild(intro);
    content.sections.forEach(section=>{const item=document.createElement('section');item.className='longform-section';const title=document.createElement('h2');title.textContent=section.h;item.appendChild(title);(section.p||[]).forEach(copy=>{const paragraph=document.createElement('p');paragraph.textContent=copy;item.appendChild(paragraph)});block.appendChild(item)});
    const context=article.querySelector('.course-context'),anchor=context&&context.parentElement||article.querySelector('.summary');
    if(anchor)anchor.insertAdjacentElement('afterend',block);else article.prepend(block);
  })();
  </script>

  <script>
  (()=>{
    const id=new URLSearchParams(location.search).get('id')||'',article=document.getElementById('article');
    if(!article||!article.querySelector('h1')||!/^l(?:[1-9]|[1-4][0-9]|50)$/.test(id))return;
    const readKey='in_course_progress';
    const readSet=()=>{try{const value=JSON.parse(localStorage.getItem(readKey)||'[]');return new Set(Array.isArray(value)?value:[])}catch(_){return new Set()}};
    const saveSet=set=>{try{localStorage.setItem(readKey,JSON.stringify([...set]))}catch(_){}};
    const title=article.querySelector('h1').textContent.trim();
    const bodyText=article.innerText.replace(/\s+/g,' ').trim();
    const words=bodyText?bodyText.split(' ').length:0;
    const minutes=Math.max(3,Math.round(words/190));
    const meta=document.createElement('div');meta.className='article-meta';meta.innerHTML='<span>Lesson '+id.slice(1).padStart(2,'0')+'</span><span>'+minutes+' min read</span><span class="meta-complete" id="completion-label">✓ Saved to your progress</span>';
    const lessonName=article.querySelector('.lesson-name');if(lessonName)lessonName.insertAdjacentElement('afterend',meta);else article.prepend(meta);
    const progress=document.createElement('div');progress.className='reading-progress';progress.setAttribute('aria-label','Reading progress');progress.innerHTML='<div class="reading-progress-label"><span>Reading progress</span><strong id="reading-percent">0%</strong></div><div class="reading-track"><div class="reading-fill" id="reading-fill"></div></div>';meta.insertAdjacentElement('afterend',progress);
    const tools=document.createElement('div');tools.className='article-tools';tools.innerHTML='<button id="completion-button" type="button">✓ Lesson completed</button><button id="copy-button" type="button">Copy lesson link</button>';progress.insertAdjacentElement('afterend',tools);
    const next=article.querySelector('.actions .button.primary');if(next){const box=document.createElement('div');box.className='next-step';box.innerHTML='<strong>Keep building the skill</strong><span>Apply this chapter in the exercise above, then continue with the next lesson or take the final assessment at the end of the course.</span>';next.parentElement.insertAdjacentElement('beforebegin',box)}
    const completed=readSet(),completionButton=document.getElementById('completion-button'),completionLabel=document.getElementById('completion-label');
    function updateCompletion(){const done=readSet().has(id);completionButton.classList.toggle('is-complete',done);completionButton.textContent=done?'✓ Lesson completed':'○ Mark lesson completed';completionLabel.textContent=done?'✓ Saved to your progress':'○ Not marked complete'}
    completionButton.addEventListener('click',()=>{const set=readSet();if(set.has(id))set.delete(id);else set.add(id);saveSet(set);updateCompletion()});
    document.getElementById('copy-button').addEventListener('click',async()=>{const button=document.getElementById('copy-button');try{await navigator.clipboard.writeText(location.href);button.textContent='✓ Link copied'}catch(_){button.textContent='Copy the URL from your browser'}setTimeout(()=>button.textContent='Copy lesson link',1800)});
    const fill=document.getElementById('reading-fill'),percent=document.getElementById('reading-percent');
    function updateReading(){const max=document.documentElement.scrollHeight-window.innerHeight;const value=max>0?Math.min(100,Math.max(0,window.scrollY/max*100)):100;fill.style.width=value+'%';percent.textContent=Math.round(value)+'%'}
    window.addEventListener('scroll',updateReading,{passive:true});window.addEventListener('resize',updateReading);updateCompletion();updateReading();
  })();
  </script>
