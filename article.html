==='l50'?'l1':'l'+(Number(id.slice(1))+1);5deg,#151b25,#10151d);border:1px solid #354052;border-radius:16px;padding:clamp(24px,6vw,58px);box-shadow:0 18px 55px #0005}h1{font:600 clamp(30px,5vw,48px)/1.08 Fraunces,Georgia,serif;text-align:center;margin:0 0 20px;color:#f5f6f8} .rule{height:1px;background:linear-gradient(90deg,transparent,#c9a35a,transparent);margin:22px 0 30px}h2{font:600 24px/1.2 Fraunces,Georgia,serif;color:#e8c27a;margin:0 0 14px}p{font-size:16px;line-height:1.85;color:#c4ccd6;margin:0 0 18px},"l28":{"title":"How to keep crypto safe","articleTitle":"Crypto security: how to protect your assets","body":"Crypto security starts with controlling access to your accounts and private keys. Use a unique password, two-factor authentication and a hardware wallet for long-term holdings. Verify addresses on a trusted device, keep recovery phrases offline and never share them. Treat unexpected links, urgent messages and guaranteed returns as warning signs."},"l29":{"title":"What is DeFi?","articleTitle":"What is DeFi? A beginner guide to decentralised finance","body":"Decentralised finance, or DeFi, uses smart contracts to offer services such as swapping, lending and liquidity provision without a traditional intermediary. The risks include coding bugs, oracle failures, impermanent loss, scams, governance attacks and irreversible transactions. Learn how the protocol works before connecting a wallet or depositing funds."},"l30":{"title":"Stablecoins: how to evaluate them","articleTitle":"How to evaluate stablecoins: reserves, risks and use cases","body":"Stablecoins are crypto assets designed to track a reference value such as the US dollar or euro. Compare the issuer, reserve model, redemption process, transparency, chain risk, fees and legal protections. A stablecoin can lose its peg or become difficult to redeem, so stability should never be treated as a guarantee."}.noticl30{border-left:3px solid #c9a35a;background:#1d180c;padding:14px 16px;color:#b9c1cc;font- rage costs and liquidity."},"l4":{"title":"Crypto vs stocks: what's the difference?","articleTitle":"Cryptocurrency versus stocks","body":"Cryptocurrencies often have higher volatility and depend on networks, protocols and communities. Stocks represent companies and may provide specific economic rights. A useful comparison includes risk, time horizon, liquidity, regulation, custody and the possibility of a total loss."},"l5":{"title":"What is market capitalization?","articleTitle":"Understanding crypto market capitalization","body":"Market capitalization is generally calculated by multiplying price by circulating supply. It helps compare the relative size of projects, but it does not measure quality, revenue or security. Also check fully diluted valuation, locked tokens and holder concentration."},"l6":{"title":"What does \"volatility\" mean?","articleTitle":"Volatility and price risk","body":"Volatility measures how much and how quickly a price moves. In crypto, it can rise because of news, liquidations, lif(!item){root.innerHTML='<h1>Article not found</h1><div class="actions"><a class="btn primary" href="blog.html">Back to lessons</a></div>'}else{ document.title=item.articleTitle+' | InvestingNoobs'; document.querySelector('meta[name=description]').setAttribute('content',item.articleTitle+' — a practical crypto and investing guide for beginners. Learn the essentials, risks and best practices.'); document.querySelector('meta[property="og:title"]').setAttribute('content',item.articleTitle); document.querySelector('meta[property="og:description"]').setAttribute('content',item.body); const next=id==='l50'?'l1':'l'+(Number(id.slice(1))+1); root.innerHTML='<div class="article-kicker">INVESTINGNOOBS LEARNING SERIES</div>'+ '<h1>'+item.articleTitle+'</h1><div class="rule"></div>'+ '<h2>'+item.title+'</h2>'+ '<p class="lead">'+item.body+'</p>'+ '<h3>Why this topic matters</h3>'+ '<p>Understanding '+item.title.toLowerCase()+' is an important part of becoming a more informed investor. Financial markets reward preparation, patience and clear thinking, but they can also punish decisions made without a plan. This guide explains the idea in practical language and gives you a framework for evaluating it before risking real money.</p>'+ '<p>Start by separating facts from assumptions. A price chart, a social-media post or a marketing promise is not the same as evidence. Consider what creates value, who carries the risk, how the product works and what could make your original idea wrong.</p>'+ '<h3>How to think about it</h3>'+ '<p>Use a simple process: define the opportunity, identify the downside, choose a time horizon and decide what information would change your mind. Write these points down before acting. A written process reduces emotional decisions and makes it easier to review your results honestly.</p>'+ '<p>Costs and liquidity matter as much as the headline return. Fees, spreads, funding, taxes, slippage and withdrawal limits can change an apparently attractive result. Always check the official terms of the platform or provider and confirm that the service is available and regulated in your country.</p>'+ '<h3>A practical framework</h3>'+ '<ol><li><strong>Learn the mechanics.</strong> Know exactly what you own or trade, how orders are executed and what happens in a fast market.</li><li><strong>Measure the risk.</strong> Estimate the maximum realistic loss, including leverage, gaps, liquidation and counterparty risk.</li><li><strong>Start small.</strong> Use simulation or an amount you can afford to lose while you test your assumptions.</li><li><strong>Review the evidence.</strong> Keep a journal of decisions, costs, outcomes and mistakes. Improve the process, not just the last trade.</li></ol>'+ '<h3>Common mistakes</h3>'+
