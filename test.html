<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Crypto & Investing Test | InvestingNoobs</title><style>body{margin:0;background:#0b0f14;color:#eef1f5;font-family:system-ui;line-height:1.6}main{max-width:800px;margin:auto;padding:48px 20px}.card{background:#151c26;border:1px solid #354052;border-radius:16px;padding:28px;margin:18px 0}h1,h2{font-family:Georgia,serif;color:#f1c86d}input{width:100%;padding:12px;margin:7px 0 18px;background:#0d131c;border:1px solid #475467;border-radius:8px;color:white;box-sizing:border-box}button{background:#c9a35a;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}label{display:block;margin:8px 0}.question{margin:24px 0}.certificate{background:#f7f1df;color:#17202a;padding:42px 28px;text-align:center;border:8px double #c9a35a;margin-top:25px}.hidden{display:none}.muted{color:#aeb8c5}.back{color:#e4bd67}<style>@media print{body{background:white}.back,#quiz,#submit,main>h1,main>p,.card:not(#result){display:none!important}main{padding:0;max-width:none}.certificate{box-shadow:none!important;margin:0!important} }.hero{text-align:center;padding:28px 0 10px}.hero-badge{display:inline-block;border:1px solid #c9a35a;color:#f1c86d;border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.14em}.intro{max-width:620px;margin:0 auto 26px;text-align:center}.question{padding:20px 0;border-top:1px solid #273242}.question strong{display:block;margin-bottom:12px}.question label{padding:8px 10px;border-radius:7px}.question label:hover{background:#202a38}.certificate{box-shadow:0 12px 40px #0007;border-radius:12px}.certificate .seal{font-size:46px}.certificate h1{font-size:36px;margin:12px 0;color:#182331}.certificate h2{color:#a77c2d}</style></style></head><body><main><a class="back" href="blog.html">← Back to lessons</a><div class="hero"><span class="hero-badge">INVESTINGNOOBS ACADEMY</span><h1>Final Knowledge Test</h1><p class="intro">Test what you have learned about cryptocurrency, investing, trading and risk management.</p></div><p class="muted">Enter your details, answer all questions and submit. A score of 80% or higher earns a certificate.</p><div class="card"><label>Full name<input id="name" required placeholder="Your full name"></label><label>Email address (optional)<input id="email" type="email" placeholder="you@example.com"></label></div><form id="quiz" class="card"></form><button id="submit" type="button">Submit test</button><div id="result" class="hidden"></div></main><script>
const questions=[["What does market capitalization generally measure?",["Price multiplied by circulating supply","A guaranteed return","The daily trading fee"],0],["What is diversification intended to do?",["Spread exposure across different assets","Guarantee profits","Remove every form of risk"],0],["What does volatility describe?",["How much and how quickly a price moves","A fixed interest rate","A company’s legal status"],0],["What is leverage?",["A tool that increases position exposure and also losses","A type of wallet backup","A guaranteed insurance policy"],0],["What should a stop-loss define?",["The point where a trade idea is no longer valid","The maximum possible profit","A tax exemption"],0],["What is drawdown?",["A decline from a previous account peak","A deposit bonus","A blockchain consensus method"],0],["What is a recovery phrase?",["Sensitive wallet backup information that must be kept private","A public marketing slogan","A stock exchange"],0],["What should you compare before joining a prop firm?",["Targets, drawdown rules, fees and withdrawal terms","Only its logo","Only its social-media followers"],0],["What is a key trading habit?",["Following a written plan and managing risk","Chasing every price movement","Risking all capital on one trade"],0],["What is the safest general principle?",["Never invest money you cannot afford to lose","Guaranteed returns are normal","Borrow as much as possible"],0]];
const quiz=document.getElementById("quiz");questions.forEach((q,i)=>{quiz.insertAdjacentHTML("beforeend",'<div class="question"><strong>'+(i+1)+". "+q[0]+"</strong>"+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+a+"</label>").join("")+"</div>")});
document.getElementById("submit").onclick=()=>{const name=document.getElementById("name").value.trim();if(!name){alert("Please enter your full name.");return}let score=0;questions.forEach((q,i)=>{const a=document.querySelector('input[name="q'+i+'"]:checked');if(a&&Number(a.value)===q[2])score++});const pct=Math.round(score/questions.length*100);const result=document.getElementById("result");result.classList.remove("hidden");const safe=name.replace(/[<>&"]/g,"");if(pct>=80){result.innerHTML='<div class="certificate"><div class="seal">◆</div><h2>InvestingNoobs Certified Learner</h2><p>This personalized certificate is awarded to</p><h1>'+safe+'</h1><p>for successfully completing the Crypto & Investing Learning Course.</p><h2>'+pct+'% · Passed</h2><p>Issued '+new Date().toLocaleDateString()+"</p><button onclick=&quot;window.print()&quot;>Print / Save certificate</button></div>"}else{result.innerHTML='<div class="card"><h2>Not passed yet</h2><p>Your score: '+pct+'%. You need at least 80%. Review the lessons and try again.</p></div>'}result.scrollIntoView({behavior:"smooth"})};
</script></body></html>
