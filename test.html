<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Crypto & Investing Test | InvestingNoobs</title><style>body{margin:0;background:#0b0f14;color:#eef1f5;font-family:system-ui;line-height:1.6}main{max-width:800px;margin:auto;padding:48px 20px}.card{background:#151c26;border:1px solid #354052;border-radius:16px;padding:28px;margin:18px 0}h1,h2{font-family:Georgia,serif;color:#f1c86d}input{width:100%;padding:12px;margin:7px 0 18px;background:#0d131c;border:1px solid #475467;border-radius:8px;color:white;box-sizing:border-box}button{background:#c9a35a;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}label{display:block;margin:8px 0}.question{margin:24px 0}.certificate{background:#f7f1df;color:#17202a;padding:42px 28px;text-align:center;border:8px double #c9a35a;margin-top:25px}.hidden{display:none}.muted{color:#aeb8c5}.back{color:#e4bd67}<style>@media print{body{background:white}.back,#quiz,#submit,main>h1,main>p,.card:not(#result){display:none!important}main{padding:0;max-width:none}.certificate{box-shadow:none!important;margin:0!important} }.hero{text-align:center;padding:28px 0 10px}.hero-badge{display:inline-block;border:1px solid #c9a35a;color:#f1c86d;border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.14em}.intro{max-width:620px;margin:0 auto 26px;text-align:center}.question{padding:20px 0;border-top:1px solid #273242}.question strong{display:block;margin-bottom:12px}.question label{padding:8px 10px;border-radius:7px}.question label:hover{background:#202a38}.certificate{box-shadow:0 12px 40px #0007;border-radius:12px}.certificate .seal{font-size:46px}.certificate h1{font-size:36px;margin:12px 0;color:#182331}.certificate h2{color:#a77c2d}</style></style></head><body><main><a class="back" href="blog.html">← Back to lessons</a><div class="hero"><span class="hero-badge">INVESTINGNOOBS ACADEMY</span><h1>Final Knowledge Test</h1><p class="i l information"],0],["What is technical analysis?",["Studying price and volume data for patterns and levels","Reading private keys","Guaranteeing future prices"],0],["Why can past performance be misleading?",["Future conditions can differ and results may not repeat","Markets always repeat exactly","Fees never matter"],0],["What is position sizing?",["Choosing how much capital to allocate to a trade","Choosing a username","Selecting a wallet color"],0],["What is risk per trade?",["The amount you are prepared to lose if the idea fails","The expected maximum profit","The exchange’s revenue"],0],["What is risk-reward ratio?",["A comparison between potential loss and potential gain","A tax rate","A network fee"],0],["What is liquidation?",["Forced closure when collateral is insufficient","A guaranteed withdrawal","A type of cold storage"],0],["Why does custody matter?",["The holder and provider can affect access and counterparty risk","It guarantees prices","It removes passwords"],0],["What is cold storage?",["Keeping keys offline to reduce some online exposure","Keeping coins in a social network","A trading indicator"],0],["What is a crypto scam warning sign?",["Guaranteed returns and pressure to act immediately","Clear terms and independent verification","A transparent fee schedule"],0],["Why verify a website domain?",["Imitation sites can steal credentials or funds","It guarantees profit","It changes blockchain consensus"],0],["What is a trading journal?",["A record of decisions, risk and outcomes","A wallet address list only","A prediction service"],0],["What is FOMO?",["Fear of missing out that can drive impulsive decisions","A blockchain protocol","A tax category"],0],["What is revenge trading?",["Increasing risk after a loss to try to recover quickly","A portfolio hedge","A wallet backup"],0],["What is a maximum daily loss rule?",["A limit intended to stop trading after a defined loss","A minimum profit target","A token standard"],0],["What should a prop firm agreement explain?",["Rules, fees, risk limits and payout conditions","Only promotional slogans","Only the company logo"],0],["Why do overnight rules matter?",["Positions and markets can behave differently outside trading hours","They guarantee no losses","They remove funding costs"],0],["What is a derivative?",["A contract whose value relates to an underlying asset","A type of recovery phrase","A guaranteed bond"],0],["Why should taxes be checked?",["Tax treatment depends on activity and jurisdiction","Taxes never apply to digital assets","Exchanges decide every tax law"],0],["What is the purpose of reviewing a strategy?",["To identify whether the process works and where risks appear","To guarantee the next trade","To avoid recording losses"],0],["What is a realistic investing expectation?",["Returns are uncertain and risk must be managed","Every trade should win","High returns have no downside"],0]];
