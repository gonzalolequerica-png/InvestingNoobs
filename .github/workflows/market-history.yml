name: Market history (daily closes)

on:
  schedule:
    - cron: "40 21 * * *"   # every day after the US close (crypto trades at weekends too)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build history, signals and asset pages
        run: python build-market-history.py
      - name: Commit if it changed
        run: |
          git config user.name "market-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-history.json signals.json signals.html sitemap.xml should-i-buy-*-today.html
          git diff --cached --quiet || (git commit -m "Daily closes and 7-day signals" && git pull --rebase && git push)
