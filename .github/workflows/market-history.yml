name: Market history (daily closes)

on:
  schedule:
    - cron: "40 21 * * 1-5"   # weekdays after the US close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build market-history.json
        run: python build-market-history.py
      - name: Commit if it changed
        run: |
          git config user.name "market-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-history.json
          git diff --cached --quiet || (git commit -m "Daily closes for the 7-day signal" && git push)
